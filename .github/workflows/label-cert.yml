# When an issue form is opened, adds the "cwes" label (and "vault" for prep notes issues).
name: Label issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const field = (h) => { const m = body.match(new RegExp("^### " + h + "[ \\t]*[\\r\\n]+([^\\r\\n]+)", "m")); return m ? m[1].trim() : ""; };
            const labels = ["cwes"];
            if ((field("Where should it go") || field("Where")).startsWith("Prep ")) labels.push("vault");
            await github.rest.issues.addLabels({...context.repo, issue_number: context.payload.issue.number, labels});
