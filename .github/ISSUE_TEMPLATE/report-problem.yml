name: Report a problem
description: A wrong module, a dead link, a typo, or something broken in the CWES tracker, prep notes, or site.
title: "[Problem] [CWES] "
labels: ["problem", "cwes"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Study tracker, Practice boxes, Resources page, Prep notes, Notes page, CWES hub, FAQ, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: Which day, task, note, or link, and what it should be instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device (for display problems)
      placeholder: Chrome on Linux, Safari on iPhone
  - type: input
    id: obsidian
    attributes:
      label: App, version and OS (for prep notes problems)
      placeholder: Obsidian 1.8 on Linux, Notion in Chrome, CherryTree 1.2 on Kali
